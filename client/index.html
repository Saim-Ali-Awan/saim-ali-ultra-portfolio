    <script>
      (function () {
        var count = document.getElementById("boot-count");
        var bar = document.getElementById("boot-bar");
        var start = performance.now();
        var finished = false;
        function tick(now) {
          if (finished) return;
          var p = Math.min(92, ((now - start) / 1600) * 92);
          if (count) count.textContent = String(Math.floor(p)).padStart(2, "0");
          if (bar) bar.style.transform = "scaleX(" + p / 100 + ")";
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        window.setTimeout(function () {
          if (window.__finishBootLoader) window.__finishBootLoader();
        }, 5000);
        window.__finishBootLoader = function () {
          if (finished) return;
          finished = true;
          if (count) count.textContent = "100";
          if (bar) bar.style.transform = "scaleX(1)";
          var loader = document.getElementById("site-loader");
          if (!loader) return;
          loader.classList.add("boot-loader--done");
          window.setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 800);
        };
      })();
    </script>
